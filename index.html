<!DOCTYPE html>
<html lang="en">
<html translate="no">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="./models/drawable_object.class.js"></script>
    <script src="./models/movable_object.class.js"></script>
    <script src="./models/character.class.js"></script>
    <script src="./models/chicken.class.js"></script>
    <script src="./models/cloud.class.js"></script>
    <script src="./models/throwable_object.class.js"></script>
    <script src="./models/bottle.class.js"></script>
    <script src="./models/coin.class.js"></script>
    <script src="./models/status_bar.class.js"></script>
    <script src="./models/background_object.class.js"></script>
    <script src="./models/keyboard.class.js"></script>
    <script src="./models/endboss.class.js"></script>
    <script src="./models/level.class.js"></script>
    <script src="./levels/level1.js"></script>
    <script src="./models/world.class.js"></script>
    <script src="./scripts/script.js"></script>

    <title>El Pollo Loco</title>
</head>

<body onload="init()">
    <h1>El Pollo Loco</h1>
    <main>
        <div class="canvas_frame">
            <canvas id="canvas" width="720" height="480"></canvas>
        </div>
        <div class="keyboard_mapping">
            <div class="key">
                <img class="arrow" src="./img/assets/arrow_left.svg" alt="arrow left">
                <span class="instructions">Left</span>
            </div>
            <div class="key">
                <img class="arrow" src="./img/assets/arrow_right.svg" alt="arrow right">
                <span class="instructions">Right</span>
            </div>
            <div class="key">
                <img class="arrow" src="./img/assets/arrow_upward.svg" alt="arrow upward">
                <span class="instructions">Jump</span>
            </div>
            <div class="key">
                <span class="d_key">d</span>
                <span class="instructions">Throw</span>
            </div>
        </div>
    </main>
</body>

</html>
